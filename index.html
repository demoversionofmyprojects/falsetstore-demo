<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falset Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --milk: #faf6f0;
    --cream: #f3ece1;
    --beige: #e6d9c6;
    --sand: #cbb89c;
    --gold: #b9a07c;
    --navy: #1e2a44;
    --navy-soft: #3a4763;
    --ink: #2b2a28;
    --muted: #8a8174;
    --line: rgba(30, 42, 68, .12);
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Manrope", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--milk); color: var(--ink); font-family: var(--sans); font-weight: 400; }
  body { min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }
  button, input { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; min-height: 74vh; display: grid; place-items: center; text-align: center;
    padding: 64px 24px 40px; overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% 0%, #fff 0%, transparent 60%),
      radial-gradient(90% 60% at 100% 100%, rgba(30,42,68,.10), transparent 70%),
      linear-gradient(180deg, var(--milk), var(--cream));
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55;
    animation: float 14s ease-in-out infinite alternate;
  }
  .hero::before { width: 260px; height: 260px; background: var(--beige); top: -60px; left: -80px; }
  .hero::after { width: 220px; height: 220px; background: rgba(30,42,68,.18); bottom: -70px; right: -60px; animation-delay: -6s; }
  @keyframes float { to { transform: translate(30px, 24px) scale(1.08); } }

  .hero-inner { position: relative; z-index: 1; }
  .brand {
    font-family: var(--serif); font-weight: 300; font-style: italic; line-height: .9;
    font-size: clamp(76px, 24vw, 132px); margin-bottom: 6px; letter-spacing: -.01em;
    background: linear-gradient(100deg, var(--navy) 0%, var(--navy) 40%, var(--gold) 50%, var(--navy) 60%, var(--navy) 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; animation: rise 1.4s .2s ease forwards, shimmer 6s 2s ease-in-out infinite;
  }
  .brand span { display: block; font-style: normal; font-size: .28em; letter-spacing: .6em; margin-top: 10px; padding-left: .6em; }
  @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .ornament {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin: 26px auto 22px;
    color: var(--sand); opacity: 0; animation: rise 1s .8s ease forwards;
  }
  .ornament i { height: 1px; width: 56px; background: linear-gradient(90deg, transparent, var(--sand)); }
  .ornament i:last-child { transform: scaleX(-1); }
  .tagline {
    font-family: var(--serif); font-size: 23px; font-weight: 400; color: var(--navy-soft); line-height: 1.3;
    max-width: 290px; margin: 0 auto; opacity: 0; animation: rise 1s 1s ease forwards;
  }
  .tagline em { color: var(--gold); }
  .scroll-hint {
    margin-top: 44px; font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: rise 1s 1.4s ease forwards;
  }
  .scroll-hint::after {
    content: ""; display: block; width: 1px; height: 36px; margin: 12px auto 0;
    background: linear-gradient(var(--navy-soft), transparent); animation: drip 2.2s ease-in-out infinite;
  }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* ---------- Toolbar: search, filters, cart, tabs ---------- */
  .catalog { padding: 32px 16px 0; }
  .section-title { text-align: center; margin-bottom: 18px; }
  .section-title h2 { font-family: var(--serif); font-weight: 300; font-size: 38px; color: var(--navy); }
  .section-title p { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }

  .toolbar {
    position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px 6px;
    background: rgba(250,246,240,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .bar { display: flex; gap: 8px; align-items: center; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px;
    border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--navy-soft);
    box-shadow: 0 8px 24px -18px rgba(30,42,68,.5); transition: border-color .3s, box-shadow .3s;
  }
  .search:focus-within { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(185,160,124,.15); }
  .search input { flex: 1; min-width: 0; height: 100%; outline: none; cursor: text; font-size: 14px; color: var(--ink); }
  .search input::placeholder { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--muted); }
  .search .clear { display: none; font-size: 18px; color: var(--muted); }
  .search.has-q .clear { display: block; }
  .icon-btn {
    position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); background: #fff; color: var(--navy); transition: transform .2s;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.dark { background: var(--navy); color: var(--milk); border-color: var(--navy); }
  .badge {
    position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
    background: var(--gold); color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center;
    border: 2px solid var(--milk);
  }
  .badge:empty { display: none; }
  .bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.35); } }

  .tabs { position: relative; display: flex; gap: 22px; overflow-x: auto; padding: 14px 4px 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; position: relative; font-family: var(--serif); font-size: 21px; font-style: italic; color: var(--muted);
    transition: color .3s; padding-bottom: 6px;
  }
  .tab sup { font-family: var(--sans); font-style: normal; font-size: 9.5px; margin-left: 3px; letter-spacing: .05em; color: var(--sand); }
  .tab[aria-selected="true"] { color: var(--navy); }
  .tab-line {
    position: absolute; bottom: 8px; height: 1.5px; background: var(--navy); border-radius: 2px;
    transition: left .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1);
  }
  .tab-line::after { content: "✦"; position: absolute; right: -12px; top: -7px; font-size: 9px; color: var(--gold); }

  .summary { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted); padding: 8px 2px 16px; letter-spacing: .03em; }
  .summary button { color: var(--navy-soft); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Grid & placeholders ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card { text-align: left; opacity: 0; animation: rise .7s ease forwards; }
  .ph {
    position: relative; aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: 0 12px 30px -20px rgba(30,42,68,.45);
    display: grid; place-items: center; text-align: center;
  }
  .ph::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.65); border-radius: 14px; }
  .ph::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 66%);
    transform: translateX(-100%); transition: transform 1.1s ease;
  }
  .card:hover .ph::after, .card:active .ph::after { transform: translateX(100%); }
  .ph .mono { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 58px; color: rgba(30,42,68,.42); line-height: 1; }
  .ph .house { display: block; margin-top: 10px; font-size: 8.5px; letter-spacing: .34em; text-transform: uppercase; color: rgba(30,42,68,.5); }
  .ph .tag {
    position: absolute; top: 16px; left: 16px; font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    background: rgba(250,246,240,.9); color: var(--navy); padding: 5px 9px; border-radius: 999px;
  }
  .card .brand-name { font-size: 9.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
  .card h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; color: var(--ink); margin-top: 3px; line-height: 1.15; }
  .card .price { font-size: 13px; color: var(--navy); margin-top: 5px; font-weight: 500; letter-spacing: .02em; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--muted); }

  /* ---------- Sheet ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(30,42,68,.28); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 20;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow-y: auto; z-index: 21;
    background: var(--milk); border-radius: 28px 28px 0 0; transform: translateY(105%);
    transition: transform .5s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .open .backdrop { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet.modal {
    top: 50%; bottom: auto; left: 16px; right: 16px; max-width: 420px; margin: 0 auto; max-height: 84vh;
    border-radius: 28px; padding-bottom: 24px; opacity: 0; transform: translateY(-46%) scale(.94);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; box-shadow: 0 30px 80px -30px rgba(30,42,68,.55);
  }
  .open .sheet.modal { opacity: 1; transform: translateY(-50%); }
  .sheet.modal .sheet-head { margin-top: 4px; }
  .sheet > .ph { border-radius: 0; aspect-ratio: 4 / 3.6; box-shadow: none; }
  .sheet > .ph .mono { font-size: 96px; }
  .grab { display: block; width: 40px; height: 4px; margin: 10px auto 0; border-radius: 4px; background: var(--beige); }
  .ph + .grab, .sheet > .grab:first-child { position: absolute; left: 50%; margin-left: -20px; top: 0; z-index: 2; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; z-index: 2;
    background: rgba(255,255,255,.9); color: var(--navy); font-size: 20px; line-height: 1;
  }
  .sheet-body { padding: 22px 20px 0; }
  .sheet-head { font-family: var(--serif); font-weight: 300; font-size: 34px; color: var(--navy); margin: 18px 0 18px; }
  .sheet-body .cat { font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .sheet-body h3 { font-family: var(--serif); font-weight: 400; font-size: 32px; color: var(--navy); line-height: 1.05; margin: 8px 0 10px; }
  .sheet-body .price { font-size: 18px; color: var(--navy); font-weight: 500; }
  .sheet-body .desc { font-size: 14px; line-height: 1.65; color: #55514b; margin: 16px 0 20px; }
  .label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .label b { float: right; font-weight: 500; letter-spacing: .04em; text-transform: none; color: var(--navy); font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .opt {
    min-width: 48px; height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; color: var(--navy); background: #fff; transition: background .25s, color .25s;
  }
  .opt[aria-pressed="true"] { background: var(--navy); color: var(--milk); border-color: var(--navy); }
  .opt.serif { font-family: var(--serif); font-style: italic; font-size: 16px; }
  .primary {
    width: 100%; height: 54px; border-radius: 16px; background: var(--navy); color: var(--milk);
    font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; transition: transform .2s, background .3s;
  }
  .primary:active { transform: scale(.98); }
  .primary.done { background: #6f7f63; }
  .ghost { width: 100%; height: 44px; margin-top: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  input[type=range] { width: 100%; accent-color: var(--navy); margin-bottom: 26px; cursor: pointer; }

  .line { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .line .ph { width: 64px; flex: none; border-radius: 12px; box-shadow: none; }
  .line .ph::before { inset: 4px; border-radius: 9px; }
  .line .ph .mono { font-size: 24px; }
  .line .info { flex: 1; min-width: 0; }
  .line .info small { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .line .info p { font-family: var(--serif); font-size: 17px; line-height: 1.15; }
  .line .info span { font-size: 12px; color: var(--muted); }
  .qty { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); color: var(--navy); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0; }
  .total span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .total b { font-family: var(--serif); font-weight: 500; font-size: 28px; color: var(--navy); }

  footer { text-align: center; margin-top: 48px; font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 15px; }

  /* ---------- Desktop ---------- */
  @media (min-width: 900px) {
    .hero { min-height: 86vh; }
    .brand { font-size: 168px; }
    .tagline { max-width: 440px; font-size: 28px; }
    .catalog { max-width: 1200px; margin: 0 auto; padding: 72px 40px 0; }
    .section-title h2 { font-size: 52px; }
    .toolbar { margin: 0 -40px; padding: 16px 40px 8px; }
    .bar { max-width: 680px; margin: 0 auto; }
    .tabs { justify-content: center; gap: 36px; }
    .tab { font-size: 24px; }
    .summary { padding: 14px 2px 24px; }
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 44px 24px; }
    .card { transition: transform .4s ease; }
    .card:hover { transform: translateY(-4px); }
    .card:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .icon-btn:hover, .opt:hover { border-color: var(--gold); }
    .primary:hover { background: var(--navy-soft); }

    /* product card becomes a centered two-column window */
    .sheet:not(.modal) {
      top: 50%; bottom: auto; left: 50%; right: auto; width: min(920px, 92vw); max-height: 86vh;
      display: grid; grid-template-columns: 1fr 1fr; border-radius: 28px; padding-bottom: 0;
      opacity: 0; transform: translate(-50%, -46%) scale(.96);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; box-shadow: 0 30px 80px -30px rgba(30,42,68,.55);
    }
    .open .sheet:not(.modal) { opacity: 1; transform: translate(-50%, -50%); }
    .sheet > .ph { aspect-ratio: auto; min-height: 540px; height: 100%; }
    .sheet:not(.modal) .sheet-body { padding: 48px 40px 40px; align-self: center; }
    .sheet.modal { max-width: 480px; }
    .grab { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1 class="brand">Falset<span>STORE</span></h1>
    <div class="ornament"><i></i>✦<i></i></div>
    <p class="tagline">Світові бренди, <em>обрані</em> з любовʼю — для тих, хто відчуває деталі</p>
    <p class="scroll-hint">Каталог</p>
  </div>
</header>

<main class="catalog">
  <div class="section-title">
    <h2>Каталог</h2>
    <p>Обрані речі сезону</p>
  </div>

  <div class="toolbar">
    <div class="bar">
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="Знайти бренд чи річ…" autocomplete="off">
        <button class="clear" id="clearQ" aria-label="Очистити">×</button>
      </label>
      <button class="icon-btn" id="filterBtn" aria-label="Фільтри">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span class="badge" id="filterBadge"></span>
      </button>
      <button class="icon-btn dark" id="cartBtn" aria-label="Кошик">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
        <span class="badge" id="cartBadge"></span>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>

  <div class="summary"><span id="count"></span><button id="reset" hidden>Скинути фільтри</button></div>
  <section class="grid" id="grid"></section>
  <footer>Falset Store — з любовʼю до деталей</footer>
</main>

<div id="layer">
  <div class="backdrop" id="backdrop"></div>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true"></article>
</div>

<script>

  { id: 1, brand: "Max Mara", cat: "Одяг", name: "Пальто «Manuela»", price: 68900, tag: "New", sizes: ["XS","S","M","L"], tone: ["#f1e8da","#d9c6a8"], desc: "Культове пальто з верблюжої вовни з поясом та накладними кишенями. Вільний силует, що пасує до всього." },
  { id: 2, brand: "Loro Piana", cat: "Одяг", name: "Кашеміровий светр", price: 54200, sizes: ["S","M","L"], tone: ["#eef0f3","#c8cfdb"], desc: "Светр з кашеміру baby cashmere у відтінку туманного неба. Невагомий і неймовірно теплий." },
  { id: 3, brand: "The Row", cat: "Одяг", name: "Шовкова сорочка «Big Sisea»", price: 38500, sizes: ["XS","S","M"], tone: ["#f6f1ea","#e2d6c5"], desc: "Об'ємна сорочка з щільного шовку молочного кольору. Мінімалізм, у якому все вирішує крій." },

  { id: 7, brand: "Acne Studios", cat: "Одяг", name: "Шкіряна куртка", price: 46300, sizes: ["S","M","L"], tone: ["#e4e7ee","#b9c1d0"], desc: "Куртка з мʼякої шкіри ягняти глибокого синього кольору. Подовжений силует, металева фурнітура." },
  { id: 8, brand: "Bottega Veneta", cat: "Сумки", name: "Сумка «Andiamo»", price: 158000, tag: "Limited", sizes: ["One size"], tone: ["#efe6d8","#d4bf9f"], desc: "Сумка з фірмовим плетінням intrecciato та металевим вузлом. Річ, що стає спадком." },
  { id: 9, brand: "The Row", cat: "Сумки", name: "Сумка «Margaux 10»", price: 189000, sizes: ["One size"], tone: ["#ece8e2","#cfc5b8"], desc: "Мʼяка сумка з телячої шкіри з подвійними ручками. Тиха впевненість без жодного логотипу." },
  { id: 10, brand: "Cartier", cat: "Прикраси", name: "Браслет «Love»", price: 312000, sizes: ["16","17","18"], tone: ["#f4ecdd","#dcc49b"], desc: "Легендарний браслет з жовтого золота 750 проби з гвинтовою застібкою." },
  { id: 11, brand: "Sophie Buhai", cat: "Прикраси", name: "Сережки «Ellipse»", price: 16800, sizes: ["One size"], tone: ["#eceff3","#ccd3de"], desc: "Скульптурні сережки зі стерлінгового срібла. Мистецтво, яке можна носити щодня." },
];

const tg = window.Telegram?.WebApp;
const uah = n => n.toLocaleString("uk-UA") + " ₴";
const MAXP = Math.max(...PRODUCTS.map(p => p.price));
const state = { cat: "Усі", q: "", brands: new Set(), max: MAXP, sort: "rec" };
const cart = []; // { id, size, qty }
const $ = id => document.getElementById(id);

if (tg) {
  tg.ready(); tg.expand();
  tg.setHeaderColor?.("#faf6f0"); tg.setBackgroundColor?.("#faf6f0");
  tg.BackButton.onClick(closeSheet);
}
const haptic = t => tg?.HapticFeedback?.impactOccurred(t);
const notify = t => tg?.HapticFeedback?.notificationOccurred(t);

const initials = b => b.split(" ").map(w => w[0]).join("").slice(0, 2);
const ph = (p, extra = "", tag = "") => `
  <div class="ph" style="--a:${p.tone[0]};--b:${p.tone[1]}">
    <div><span class="mono">${initials(p.brand)}</span>${extra}</div>${tag && `<span class="tag">${tag}</span>`}
  </div>`;

/* ---------- Tabs ---------- */
function renderTabs() {
  const cats = ["Усі", ...new Set(PRODUCTS.map(p => p.cat))];
  $("tabs").innerHTML = cats.map(c => {
    const n = c === "Усі" ? PRODUCTS.length : PRODUCTS.filter(p => p.cat === c).length;
    return `<button class="tab" role="tab" aria-selected="${c === state.cat}">${c}<sup>${String(n).padStart(2, "0")}</sup></button>`;
  }).join("") + `<span class="tab-line" id="tabLine"></span>`;
  $("tabs").querySelectorAll(".tab").forEach((b, i) => b.onclick = () => { state.cat = cats[i]; haptic("light"); renderTabs(); render(); });
  moveLine();
}
function moveLine() {
  const a = $("tabs").querySelector('[aria-selected="true"]'), line = $("tabLine");
  line.style.left = a.offsetLeft + "px";
  line.style.width = a.querySelector("sup").offsetLeft + "px"; // underline the word, not the counter (.tab is the offsetParent)
}

/* ---------- Grid ---------- */
function visible() {
  const q = state.q.trim().toLowerCase();
  const list = PRODUCTS.filter(p =>
    (state.cat === "Усі" || p.cat === state.cat) &&
    (!q || `${p.brand} ${p.name} ${p.cat}`.toLowerCase().includes(q)) &&
    (!state.brands.size || state.brands.has(p.brand)) &&
    p.price <= state.max);
  if (state.sort === "asc") list.sort((a, b) => a.price - b.price);
  if (state.sort === "desc") list.sort((a, b) => b.price - a.price);
  if (state.sort === "new") list.sort((a, b) => (b.tag === "New") - (a.tag === "New"));
  return list;
}
const activeFilters = () => state.brands.size + (state.max < MAXP) + (state.sort !== "rec");

function render() {
  const list = visible();
  $("grid").innerHTML = list.length ? list.map((p, i) => `
    <button class="card" data-id="${p.id}" style="animation-delay:${i * 60}ms">
      ${ph(p, `<span class="house">${p.brand}</span>`, p.tag)}
      <p class="brand-name">${p.brand}</p>
      <h3>${p.name}</h3>
      <p class="price">${uah(p.price)}</p>
    </button>`).join("") : `<p class="empty">Нічого не знайдено…</p>`;
  $("grid").querySelectorAll(".card").forEach(c => c.onclick = () => openProduct(+c.dataset.id));
  $("count").textContent = `${list.length} ${plural(list.length, "річ", "речі", "речей")}`;
  $("filterBadge").textContent = activeFilters() || "";
  $("reset").hidden = !activeFilters() && !state.q;
}
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many;

/* ---------- Sheet ---------- */
function openSheet(html, mode = "") {
  const sheet = $("sheet");
  // switch layout without animating between the two hidden positions
  sheet.style.transition = "none"; sheet.className = "sheet " + mode; sheet.offsetWidth; sheet.style.transition = "";
  $("sheet").innerHTML = html + `<button class="close" aria-label="Закрити">×</button>`;
  $("sheet").querySelector(".close").onclick = closeSheet;
  $("sheet").scrollTop = 0;
  $("layer").classList.add("open");
  document.body.style.overflow = "hidden";
  tg?.BackButton.show();
}
const openModal = html => openSheet(html, "modal");
function closeSheet() {
  $("layer").classList.remove("open");
  document.body.style.overflow = "";
  tg?.BackButton.hide();
}
$("backdrop").onclick = closeSheet;
addEventListener("keydown", e => e.key === "Escape" && closeSheet());

function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  let size = p.sizes.length === 1 ? p.sizes[0] : null;
  openSheet(`
    ${ph(p, `<span class="house">${p.brand}</span>`)}
    <div class="sheet-body">
      <p class="cat">${p.brand} · ${p.cat}</p>
      <h3>${p.name}</h3>
      <p class="price">${uah(p.price)}</p>
      <p class="desc">${p.desc}</p>
      <p class="label">Розмір</p>
      <div class="opts">${p.sizes.map(s => `<button class="opt" aria-pressed="${s === size}">${s}</button>`).join("")}</div>
      <button class="primary">Додати до кошика</button>
    </div>`);
  const btns = $("sheet").querySelectorAll(".opt");
  btns.forEach(b => b.onclick = () => { size = b.textContent; btns.forEach(x => x.setAttribute("aria-pressed", x === b)); haptic("light"); });
  const add = $("sheet").querySelector(".primary");
  add.onclick = () => {
    if (!size) { add.textContent = "Оберіть розмір"; notify("warning"); return; }
    const row = cart.find(r => r.id === id && r.size === size);
    row ? row.qty++ : cart.push({ id, size, qty: 1 });
    notify("success");
    add.textContent = "Додано ✓"; add.classList.add("done");
    updateCartBadge();
    setTimeout(closeSheet, 700);
  };
}

function openFilters() {
  const brands = [...new Set(PRODUCTS.map(p => p.brand))].sort();
  const sorts = [["rec", "Рекомендовані"], ["new", "Новинки"], ["asc", "Ціна ↑"], ["desc", "Ціна ↓"]];
  const step = 1000;
  openModal(`
    <div class="sheet-body">
      <h3 class="sheet-head">Фільтри</h3>
      <p class="label">Сортування</p>
      <div class="opts" id="fSort">${sorts.map(([k, t]) => `<button class="opt serif" data-k="${k}" aria-pressed="${k === state.sort}">${t}</button>`).join("")}</div>
      <p class="label">Бренд</p>
      <div class="opts" id="fBrand">${brands.map(b => `<button class="opt" aria-pressed="${state.brands.has(b)}">${b}</button>`).join("")}</div>
      <p class="label">Ціна до <b id="fMaxV">${uah(state.max)}</b></p>
      <input type="range" id="fMax" min="${step * 10}" max="${MAXP}" step="${step}" value="${state.max}">
      <button class="primary" id="fApply">Показати</button>
      <button class="ghost" id="fReset">Скинути</button>
    </div>`);
  const sel = { sort: state.sort, brands: new Set(state.brands), max: state.max };
  $("fSort").querySelectorAll(".opt").forEach((b, _, all) => b.onclick = () => { sel.sort = b.dataset.k; all.forEach(x => x.setAttribute("aria-pressed", x === b)); haptic("light"); });
  $("fBrand").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = b.textContent; sel.brands.has(k) ? sel.brands.delete(k) : sel.brands.add(k);
    b.setAttribute("aria-pressed", sel.brands.has(k)); haptic("light");
  });
  // snap to MAXP at the top end so the most expensive item is never cut off by step rounding
  $("fMax").oninput = e => { sel.max = +e.target.value >= MAXP - step ? MAXP : +e.target.value; $("fMaxV").textContent = uah(sel.max); };
  $("fApply").onclick = () => { Object.assign(state, sel); render(); closeSheet(); };
  $("fReset").onclick = () => { resetFilters(); closeSheet(); };
}
function resetFilters() {
  Object.assign(state, { q: "", brands: new Set(), max: MAXP, sort: "rec" });
  $("q").value = ""; $("searchBox").classList.remove("has-q");
  render();
}

function openCart() {
  if (!cart.length) {
    openModal(`<div class="sheet-body"><h3 class="sheet-head">Кошик</h3>
      <p class="empty" style="padding:10px 0 30px">Поки що порожньо</p>
      <button class="primary" id="goShop">До каталогу</button></div>`);
    $("goShop").onclick = closeSheet;
    return;
  }
  const total = cart.reduce((s, r) => s + PRODUCTS.find(p => p.id === r.id).price * r.qty, 0);
  openModal(`
    <div class="sheet-body">
      <h3 class="sheet-head">Кошик</h3>
      ${cart.map((r, i) => { const p = PRODUCTS.find(x => x.id === r.id); return `
        <div class="line">
          ${ph(p)}
          <div class="info"><small>${p.brand}</small><p>${p.name}</p><span>${r.size} · ${uah(p.price)}</span></div>
          <div class="qty"><button data-i="${i}" data-d="-1" aria-label="Менше">−</button>${r.qty}<button data-i="${i}" data-d="1" aria-label="Більше">+</button></div>
        </div>`; }).join("")}
      <div class="total"><span>Разом</span><b>${uah(total)}</b></div>
      <button class="primary" id="checkout">Оформити замовлення</button>
    </div>`);
  $("sheet").querySelectorAll(".qty button").forEach(b => b.onclick = () => {
    const r = cart[b.dataset.i]; r.qty += +b.dataset.d;
    if (!r.qty) cart.splice(b.dataset.i, 1);
    haptic("light"); updateCartBadge(); openCart();
  });
  $("checkout").onclick = () => checkout(total);
}

// shortcut: demo checkout only shows a summary, wire to a bot/CRM for real orders
function checkout(total) {
  const msg = `Дякуємо! Менеджер звʼяжеться з вами для підтвердження.\n\nСума: ${uah(total)}`;
  tg?.showPopup ? tg.showPopup({ title: "Замовлення прийнято", message: msg, buttons: [{ type: "ok" }] }) : alert(msg);
  cart.length = 0; updateCartBadge(); closeSheet(); notify("success");
}

function updateCartBadge() {
  const b = $("cartBadge");
  b.textContent = cart.reduce((s, r) => s + r.qty, 0) || "";
  b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
}

/* ---------- Wiring ---------- */
$("q").oninput = e => { state.q = e.target.value; $("searchBox").classList.toggle("has-q", !!state.q); render(); };
$("clearQ").onclick = e => { e.preventDefault(); $("q").value = ""; state.q = ""; $("searchBox").classList.remove("has-q"); render(); };
$("filterBtn").onclick = openFilters;
$("cartBtn").onclick = openCart;
$("reset").onclick = resetFilters;
addEventListener("resize", moveLine);
document.fonts?.ready.then(moveLine);

renderTabs();
render();
</script>
</body>
</html>
